services:
  - type: web
    name: tinta-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: TINTA_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: TINTA_BOOKING_FEE
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
