name: TINTA Web Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Build web bundle
        working-directory: frontend
        run: npx expo export --platform web

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Smoke test live TINTA
        env:
          CUSTOMER_URL: https://tinta-live.vercel.app
          ARTIST_URL: https://tinta-artist-live.vercel.app
          ARTIST_FALLBACK_URL: https://tinta-artist.onrender.com
          API_URL: https://tinta-backend.onrender.com
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            async function checkPage(label, url) {
              const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
              if (!response || response.status() !== 200) {
                throw new Error(label + " returned " + (response ? response.status() : "no response"));
              }
              await page.waitForTimeout(2000);
              const text = await page.locator("body").innerText();
              if (!text.includes("TINTA")) {
                throw new Error(label + " did not render TINTA");
              }
              console.log(label + " OK (" + response.status() + ")");
            }

            await checkPage("Customer app", process.env.CUSTOMER_URL);
            await checkPage("Artist portal", process.env.ARTIST_URL);

            const api = await page.request.get(process.env.API_URL + "/api/health", { timeout: 60000 });
            if (api.status() !== 200) {
              throw new Error("Backend health returned " + api.status());
            }
            const health = await api.json();
            if (!health.ok || health.product !== "TINTA") {
              throw new Error("Unexpected backend health payload: " + JSON.stringify(health));
            }
            console.log("Backend health OK");

            const pricing = await page.request.get(process.env.API_URL + "/api/pricing", { timeout: 60000 });
            if (pricing.status() !== 200) {
              throw new Error("Pricing endpoint returned " + pricing.status());
            }
            const menu = await pricing.json();
            if (
              menu.booking_fee !== 0 ||
              menu.commission_pct !== 15 ||
              !Array.isArray(menu.packages) ||
              menu.packages.length !== 0 ||
              !Array.isArray(menu.revenue_sources) ||
              !menu.revenue_sources.includes("commission") ||
              !menu.revenue_sources.includes("advertising")
            ) {
              throw new Error("Unexpected free-launch monetization config: " + JSON.stringify(menu));
            }
            console.log("Pricing/monetization OK");

            await browser.close();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE
