name: Publish TINTA APK Publicly

on:
  workflow_run:
    workflows: ["TINTA Native Android APK"]
    types: [completed]

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download APK artifact from completed build
        uses: actions/download-artifact@v4
        with:
          name: TINTA-standalone-release-apk
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find dist -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK as a public GitHub Release
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.path }}"
          TAG="apk-${{ github.event.workflow_run.id }}"
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --title "TINTA Android APK" \
            --notes "Public TINTA Android build from workflow run ${{ github.event.workflow_run.id }}." \
            --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
