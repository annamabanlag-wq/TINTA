name: Build and publish TINTA backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/tinta-backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python backend
        run: python -m compileall -q backend

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/annamabanlag-wq/tinta-backend:render
            ghcr.io/annamabanlag-wq/tinta-backend:\${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
