<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TINTA — Open to the public</title>
  <meta name="description" content="TINTA is live. Book tattoo artists in the Philippines or apply as an artist." />
  <style>
    body { margin:0; min-height:100vh; background:#0A0A0A; color:#F5F5F5; font-family:Arial,Helvetica,sans-serif; display:flex; align-items:center; justify-content:center; }
    .card { width:min(440px,92vw); border:2px solid #E51C24; padding:28px; text-align:center; }
    h1 { letter-spacing:8px; font-size:42px; margin:0 0 8px; }
    .sub { color:#E51C24; letter-spacing:3px; font-size:12px; font-weight:800; margin-bottom:18px; }
    .qr { background:#fff; padding:14px; display:inline-block; }
    .qr img { width:220px; height:220px; display:block; }
    a { color:#F5F5F5; }
    .url { margin-top:16px; font-size:13px; word-break:break-all; }
    .hint { color:#9A9A9A; font-size:12px; margin-top:12px; line-height:1.5; }
    .row { display:flex; gap:10px; margin-top:18px; }
    .row a { flex:1; border:2px solid #E51C24; padding:12px 8px; text-decoration:none; font-size:11px; font-weight:800; letter-spacing:1px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>TINTA</h1>
    <div class="sub">OPEN TO THE PUBLIC</div>
    <div class="qr">
      <img alt="QR code for TINTA" src="https://api.qrserver.com/v1/create-qr-code/?size=440x440&amp;margin=8&amp;data=https%3A%2F%2Ftinta-live.vercel.app" />
    </div>
    <p class="url"><a href="https://tinta-live.vercel.app">https://tinta-live.vercel.app</a></p>
    <div class="row">
      <a href="https://tinta-live.vercel.app">BOOK A SESSION</a>
      <a href="https://tinta-artist-live.vercel.app">ARTIST SIGN UP</a>
    </div>
    <p class="hint">Scan the QR code to open TINTA on your phone.<br>Print this page for posters, shop counters, and flyers.</p>
  </main>
</body>
</html>
